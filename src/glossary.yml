# Глоссарий курса. Ключ — термин, как он показывается. В уроках: [[термин]] или [[термин|словоформа]].
# def — одно-два предложения, без воды. en — оригинал на английском.

Браузер:
  en: browser
  def: Программа, которая скачивает HTML, CSS и JavaScript и превращает их в страницу. Chrome, Edge, Firefox, Safari.
Клиент:
  en: client
  def: Тот, кто отправляет запрос. Обычно браузер или мобильное приложение.
Сервер:
  en: server
  def: Компьютер или программа, которая принимает запросы и отправляет ответы. Работает круглосуточно.
Фронтенд:
  en: frontend
  def: Часть приложения, которую видит пользователь и которая работает в его браузере. Строится на HTML, CSS и JavaScript.
Бэкенд:
  en: backend
  def: Часть приложения на сервере — логика, проверки, работа с базой данных. Пользователь её не видит.
Фулстек:
  en: full-stack
  def: Разработчик, который пишет и фронтенд, и бэкенд.
База данных:
  en: database, DB
  def: Программа для надёжного хранения данных и быстрого поиска по ним. Например, PostgreSQL или MongoDB.
API:
  en: Application Programming Interface
  def: Договор о том, какие запросы можно отправить программе и что она ответит. Во вебе — набор адресов на сервере, например `GET /tasks`.
HTTP:
  en: HyperText Transfer Protocol
  def: Правила, по которым браузер и сервер обмениваются запросами и ответами.
HTTPS:
  en: HTTP Secure
  def: HTTP с шифрованием (TLS). Посторонние не могут прочитать или подменить данные. Замок в адресной строке.
JSON:
  en: JavaScript Object Notation
  def: 'Текстовый формат данных: `{"name": "Анна", "age": 30}`. Основной язык общения фронтенда и бэкенда.'
URL:
  en: Uniform Resource Locator
  def: Полный адрес ресурса в интернете, например `https://shop.ru/catalog?page=2`.
Домен:
  en: domain
  def: Человекочитаемое имя сайта, например `shop.ru`. Для компьютера его переводит в IP-адрес DNS.
IP-адрес:
  en: IP address
  def: Числовой адрес компьютера в сети, например `185.12.3.4`.
DNS:
  en: Domain Name System
  def: «Телефонная книга» интернета — переводит домен в IP-адрес.
HTML:
  en: HyperText Markup Language
  def: Язык разметки. Описывает структуру страницы — заголовки, абзацы, кнопки, картинки.
CSS:
  en: Cascading Style Sheets
  def: Язык стилей. Описывает внешний вид — цвета, шрифты, размеры, расположение.
JavaScript:
  en: JS
  def: Язык программирования, который работает в браузере и отвечает за поведение страницы. На нём же пишут серверы (Node.js).
SPA:
  en: Single Page Application
  def: Приложение, которое загружается один раз, а дальше JavaScript сам меняет экран и подгружает данные. Gmail, Figma.
MPA:
  en: Multi-Page Application
  def: Сайт, где каждая страница — отдельный HTML-документ с сервера. Переход — полная перезагрузка.
SSR:
  en: Server-Side Rendering
  def: Сервер собирает готовый HTML с данными, а в браузере JavaScript «оживляет» страницу. Быстрый первый показ и хорошо для поиска.
Монолит:
  en: monolith
  def: Бэкенд, где вся логика — одно приложение с одной базой данных.
Микросервисы:
  en: microservices
  def: Бэкенд из многих маленьких сервисов. Каждый отвечает за свою часть и общается с другими через API.
DevTools:
  en: Developer Tools
  def: Инструменты разработчика в браузере. На Mac открываются сочетанием ⌥⌘I. Показывают HTML, стили, запросы, ошибки.
QA:
  en: Quality Assurance
  def: Тестировщик. Проверяет, что приложение работает как задумано, и находит баги до пользователей.
DevOps:
  en: Development + Operations
  def: Инженер, который отвечает за серверы, выкладку новых версий и стабильную работу приложения.
Деплой:
  en: deploy
  def: Выкладка приложения на сервер, чтобы им могли пользоваться другие.
Статус-код:
  en: status code
  def: Трёхзначное число в ответе сервера. 200 — всё хорошо, 404 — не найдено, 500 — ошибка сервера.
Фреймворк:
  en: framework
  def: Готовый каркас для приложения со своими правилами. React формально библиотека, но в разговоре его тоже называют фреймворком.
Терминал:
  en: Terminal
  def: Программа, в которой компьютеру дают команды текстом. На Mac — приложение «Терминал», внутри работает оболочка zsh.
Команда:
  en: command
  def: 'Строка, которую вы вводите в Терминале и отправляете клавишей Return. Например, `ls` — показать содержимое папки.'
Путь:
  en: path
  def: 'Адрес файла или папки на диске, например `/Users/mary/dev/index.html`.'
Абсолютный путь:
  en: absolute path
  def: 'Путь от самого корня диска, начинается с `/` или `~`. Работает из любой папки.'
Относительный путь:
  en: relative path
  def: 'Путь от текущей папки: `hello/index.html`, `../style.css`. Две точки `..` — папка уровнем выше.'
Домашняя папка:
  en: home directory
  def: 'Ваша личная папка на Mac: `/Users/имя`. Сокращённо — `~`.'
Расширение файла:
  en: file extension
  def: 'Окончание имени после точки: `.html`, `.css`, `.js`. По нему программы понимают, что внутри файла.'
Редактор кода:
  en: code editor
  def: Программа для написания кода с подсветкой, подсказками и проверкой ошибок. В курсе — VS Code.
Node.js:
  en: Node.js
  def: Программа, которая запускает JavaScript вне браузера. Нужна для инструментов разработки и для сервера.
npm:
  en: Node Package Manager
  def: Менеджер пакетов для JavaScript. Скачивает чужой готовый код в ваш проект. Ставится вместе с Node.js.
Git:
  en: Git
  def: Система контроля версий. Запоминает историю изменений в коде и помогает работать вместе.
LTS:
  en: Long-Term Support
  def: Версия с долгой поддержкой — стабильная, её выбирают для работы и учёбы.
Оболочка:
  en: shell
  def: 'Программа внутри Терминала, которая понимает команды и выполняет их. На Mac — zsh. Терминал — окно, оболочка — «мозг» за ним.'
Флаг:
  en: flag, option
  def: 'Настройка команды, начинается с дефиса: `ls -a` — показать и скрытые файлы.'
Аргумент:
  en: argument
  def: 'То, над чем работает команда: `cd dev` — перейти в папку `dev`, здесь `dev` — аргумент.'
Emmet:
  en: Emmet
  def: 'Встроенный в VS Code способ писать HTML сокращениями: `ul>li*3` + Tab превращается в список из трёх пунктов.'
Расширение VS Code:
  en: extension
  def: Дополнение к VS Code от сообщества или компании. Добавляет новые возможности, например Live Server.
Палитра команд:
  en: Command Palette
  def: 'Поиск по всем командам VS Code. Открывается ⇧⌘P: начните вводить название действия.'
Горячие клавиши:
  en: keyboard shortcuts
  def: 'Сочетания клавиш для частых действий: ⌘S — сохранить, ⌘/ — закомментировать строку.'
Live Server:
  en: Live Server
  def: Расширение VS Code. Открывает страницу в браузере и обновляет её при каждом сохранении файла.
Форматирование:
  en: formatting
  def: Автоматическая расстановка отступов и переносов в коде, чтобы его было легко читать. В курсе этим занимается Biome.
Линтер:
  en: linter
  def: 'Программа, которая читает код и находит ошибки и плохие практики до запуска. В курсе — Biome.'
Тег:
  en: tag
  def: 'Метка в угловых скобках, которая говорит браузеру, что это за кусок страницы: `<p>` — абзац, `<a>` — ссылка.'
Атрибут:
  en: attribute
  def: 'Дополнительная настройка тега внутри открывающего тега: `href` у ссылки, `src` и `alt` у картинки.'
Элемент:
  en: element
  def: 'Тег вместе с содержимым: `<p>Привет</p>` — элемент абзаца.'
Семантическая разметка:
  en: semantic markup
  def: 'Разметка тегами по смыслу: `header`, `nav`, `main`, `footer` вместо безликих `div`. Её понимают люди, поисковики и программы экранного доступа.'
Доступность:
  en: accessibility, a11y
  def: 'Удобство сайта для всех, включая людей с нарушениями зрения, слуха и моторики. Сокращение a11y: между a и y 11 букв.'
Альтернативный текст:
  en: alt text
  def: 'Описание картинки в атрибуте `alt`. Его читают программы экранного доступа и показывает браузер, если картинка не загрузилась.'
Форма:
  en: form
  def: 'Часть страницы, где пользователь вводит данные: поля, переключатели, кнопка отправки. Тег `<form>`.'
Поле ввода:
  en: input
  def: 'Элемент, куда пользователь вводит данные. Чаще всего `<input>`, для длинного текста — `<textarea>`.'
Подпись поля:
  en: label
  def: 'Текст, который объясняет, что вводить в поле. Тег `<label>`, связывается с полем через `for` и `id`.'
Валидация:
  en: validation
  def: 'Проверка данных перед отправкой: заполнено ли поле, похоже ли на email, подходит ли число.'
Программа экранного доступа:
  en: screen reader
  def: 'Программа, которая читает страницу вслух для незрячих людей. На Mac встроена VoiceOver: ⌘F5.'
Фокус:
  en: focus
  def: 'Элемент, который сейчас принимает ввод с клавиатуры. Переход между элементами — клавиша Tab.'
Селектор:
  en: selector
  def: 'Часть CSS-правила, которая говорит, к каким элементам оно относится: `h1`, `.card`, `nav a`.'
Свойство CSS:
  en: CSS property
  def: 'Что именно меняем у элемента: `color`, `font-size`, `padding`. Записывается с значением: `color: brown;`.'
Каскад:
  en: cascade
  def: 'Правила выбора, какой стиль применится, если несколько правил спорят за одно свойство. Отсюда «каскадные» в названии CSS.'
Специфичность:
  en: specificity
  def: 'Вес селектора в споре правил. id весомее класса, класс весомее тега. При равенстве побеждает правило ниже.'
Наследование:
  en: inheritance
  def: 'Часть свойств, например цвет и шрифт, передаётся от родителя детям. Рамки и отступы не наследуются.'
Блочная модель:
  en: box model
  def: 'Каждый элемент — прямоугольник из содержимого, внутреннего отступа padding, рамки border и внешнего отступа margin.'
rem:
  en: root em
  def: 'Единица размера относительно шрифта всей страницы. Обычно 1rem = 16px. Если человек увеличит шрифт в браузере, всё увеличится вместе.'
Поток документа:
  en: normal flow
  def: 'Как элементы располагаются без раскладки: блочные — друг под другом на всю ширину, строчные — в строку, как слова в тексте.'
Flexbox:
  en: flexible box layout
  def: 'Раскладка в одну линию: ряд или колонка. Включается `display: flex` у родителя.'
Grid:
  en: grid layout
  def: 'Раскладка сеткой из строк и колонок. Включается `display: grid` у родителя.'
fr:
  en: fraction
  def: 'Единица Grid: доля свободного места. `1fr 2fr` — вторая колонка вдвое шире первой.'
Главная ось:
  en: main axis
  def: 'Направление, в котором flex выстраивает элементы: по умолчанию слева направо. Выравнивание вдоль неё — justify-content, поперёк — align-items.'
Адаптивная вёрстка:
  en: responsive design
  def: 'Одна страница, которая перестраивается под ширину экрана: на телефоне одна колонка, на ноутбуке — три.'
Медиазапрос:
  en: media query
  def: 'Условие для блока CSS: `@media (min-width: 640px) { … }`. Правила внутри работают только на экранах от 640px.'
Mobile-first:
  en: mobile-first
  def: 'Подход к вёрстке: базовые стили пишут для телефона, а медиазапросы с `min-width` добавляют раскладку для широких экранов.'
Брейкпоинт:
  en: breakpoint
  def: 'Ширина экрана, на которой меняется вёрстка. Например, 640px — с неё карточки встают в две колонки.'
Режим устройств:
  en: device mode
  def: 'Режим Chrome DevTools, который показывает страницу в окне заданной ширины — как на телефоне или планшете. Включается ⇧⌘M.'
CSS-переменная:
  en: custom property
  def: 'Именованное значение в CSS: `--color-accent: #bc4c00;`. Используется через `var(--color-accent)`, меняется в одном месте.'
Интернет:
  en: internet
  def: 'Всемирная сеть компьютеров: кабели, Wi-Fi, провайдеры. Веб, почта и мессенджеры — сервисы, которые работают поверх неё.'
Протокол:
  en: protocol
  def: 'Правила общения программ по сети: в каком порядке и в каком формате отправлять сообщения. Для сайтов — HTTP и HTTPS.'
Метод HTTP:
  en: HTTP method
  def: 'Слово в начале запроса, которое говорит, что сделать: GET — получить, POST — создать, PUT и PATCH — изменить, DELETE — удалить.'
Репозиторий:
  en: repository
  def: 'Папка проекта вместе с историей изменений. История лежит в скрытой папке `.git` внутри проекта.'
Коммит:
  en: commit
  def: 'Сохранённый снимок проекта с сообщением: что и зачем поменяли. Из коммитов складывается история.'
Индекс:
  en: staging area
  def: 'Список изменений, которые попадут в следующий коммит. Файлы добавляют туда командой `git add`.'
Ветка:
  en: branch
  def: 'Отдельная линия коммитов. В ветке можно работать над задачей, не трогая основную ветку `main`.'
GitHub:
  en: GitHub
  def: 'Сайт, где хранят Git-репозитории: копия проекта в интернете, ревью кода и бесплатный хостинг сайтов GitHub Pages.'
Pull request:
  en: pull request, PR
  def: 'Запрос на слияние ветки в `main` на GitHub. В нём видно все изменения, и ментор оставляет комментарии к строкам кода.'
GitHub Pages:
  en: GitHub Pages
  def: 'Бесплатная публикация сайта прямо из репозитория на GitHub. Адрес вида `имя.github.io/проект`.'
Лендинг:
  en: landing page
  def: 'Одностраничный сайт, который за несколько секунд объясняет, что предлагают, и ведёт к одному действию: записаться, заказать, позвонить.'
Медиафункция:
  en: media feature
  def: 'То, что медиазапрос может спросить у браузера: ширину окна, ориентацию экрана, есть ли мышь, включена ли тёмная тема. Пример — `(orientation: landscape)`.'
Псевдокласс:
  en: pseudo-class
  def: 'Часть селектора через двоеточие: выбирает элемент по состоянию или месту. `a:hover` — ссылка под курсором, `li:first-child` — первый пункт.'
Псевдоэлемент:
  en: pseudo-element
  def: 'Часть элемента, которой нет в HTML, но её можно оформить: `::before` и `::after` добавляют содержимое в начало и конец элемента.'
Позиционирование:
  en: positioning
  def: 'Свойство `position`: как элемент встаёт относительно потока и других элементов. `relative`, `absolute`, `fixed`, `sticky`.'
Transition:
  en: CSS transition
  def: 'Плавный переход между значениями свойства: `transition: transform 0.2s`. Без него изменения при наведении происходят мгновенно.'
