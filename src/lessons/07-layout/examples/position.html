<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Позиционирование</title><link rel="stylesheet" href="demo.css">
<style>
  .wrap { display: grid; grid-template-columns: repeat(3, 250px); gap: 28px; }
  .stage { position: relative; height: 150px; padding: 12px; border: 1.5px dashed #afb8c1; border-radius: 8px; background: #f6f8fa; }
  .box { width: 110px; text-align: center; }
  .ghost { position: absolute; left: 12px; top: 12px; width: 110px; padding: 10px 14px; border: 1.5px dashed #0969da; border-radius: 6px; color: #0969da; font-weight: 600; text-align: center; opacity: .5; }
  .rel { position: relative; top: 30px; left: 40px; }
  .card { position: relative; height: 100%; padding: 14px; background: #fff; border: 1px solid #d1d9e0; border-radius: 10px; }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .badge { position: absolute; top: 8px; right: 8px; padding: 2px 8px; font-size: 12px; font-weight: 700; color: #fff; background: #1a7f37; border-radius: 999px; }
  .z .p { position: absolute; width: 110px; height: 80px; padding: 6px 8px; border-radius: 8px; font-weight: 700; }
  .p3 { text-align: right; }
  .p2 { display: grid; place-items: end start; }
  .p1 { left: 20px; top: 16px; background: #ddf4ff; border: 1.5px solid #0969da; z-index: 1; }
  .p2 { left: 70px; top: 46px; background: #dafbe1; border: 1.5px solid #1a7f37; z-index: 3; }
  .p3 { left: 120px; top: 30px; background: #fbefff; border: 1.5px solid #8250df; z-index: 2; }
</style></head><body>
<div class="wrap">
  <div><p class="label">relative; top: 30px; left: 40px</p><div class="stage"><div class="ghost">было</div><div class="box rel">стало</div></div></div>
  <div><p class="label">absolute внутри relative</p><div class="stage"><div class="card"><span class="badge">−20%</span><h3>Раф</h3><p style="margin:0;color:#59636e">Значок в углу карточки</p></div></div></div>
  <div><p class="label">z-index: 1, 3, 2</p><div class="stage z"><div class="p p1">z 1</div><div class="p p2">z 3</div><div class="p p3">z 2</div></div></div>
</div>
</body></html>
