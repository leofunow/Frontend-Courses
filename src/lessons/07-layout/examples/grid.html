<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Grid</title><link rel="stylesheet" href="demo.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 16px; border: 1.5px dashed #afb8c1; border-radius: 8px; background: #f6f8fa; position: relative; }
  .box { min-height: 70px; display: grid; place-items: center; font-size: 20px; }
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 0 16px 6px; font: 600 13px ui-monospace, monospace; color: #cf222e; text-align: center; }
  .gap { margin-top: 8px; font: 600 13px ui-monospace, monospace; color: #8250df; }
</style></head><body>
<div class="cols"><span>1fr</span><span>1fr</span><span>1fr</span></div>
<div class="grid"><div class="box">1</div><div class="box b2">2</div><div class="box b3">3</div><div class="box">4</div><div class="box b2">5</div><div class="box b3">6</div></div>
<p class="gap">grid-template-columns: repeat(3, 1fr); gap: 16px;</p>
</body></html>
