<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>justify-content</title><link rel="stylesheet" href="demo.css"><style>body{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}</style></head><body><div><p class="label">justify-content: flex-start</p><div class="row" style="justify-content:flex-start;min-height:0"><div class="box">1</div><div class="box b2">2</div><div class="box b3">3</div></div></div><div><p class="label">justify-content: center</p><div class="row" style="justify-content:center;min-height:0"><div class="box">1</div><div class="box b2">2</div><div class="box b3">3</div></div></div><div><p class="label">justify-content: flex-end</p><div class="row" style="justify-content:flex-end;min-height:0"><div class="box">1</div><div class="box b2">2</div><div class="box b3">3</div></div></div><div><p class="label">justify-content: space-between</p><div class="row" style="justify-content:space-between;min-height:0"><div class="box">1</div><div class="box b2">2</div><div class="box b3">3</div></div></div><div><p class="label">justify-content: space-around</p><div class="row" style="justify-content:space-around;min-height:0"><div class="box">1</div><div class="box b2">2</div><div class="box b3">3</div></div></div><div><p class="label">justify-content: space-evenly</p><div class="row" style="justify-content:space-evenly;min-height:0"><div class="box">1</div><div class="box b2">2</div><div class="box b3">3</div></div></div></body></html>
