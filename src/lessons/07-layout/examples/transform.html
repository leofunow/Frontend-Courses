<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>transform</title><link rel="stylesheet" href="demo.css">
<style>
  .wrap { display: grid; grid-template-columns: repeat(4, 180px); gap: 24px; }
  .stage { position: relative; height: 130px; display: grid; place-items: center; border: 1.5px dashed #afb8c1; border-radius: 8px; background: #f6f8fa; }
  .box { width: 90px; text-align: center; }
  .ghost { position: absolute; width: 90px; padding: 10px 14px; border: 1.5px dashed #0969da; border-radius: 6px; opacity: .45; height: 41px; }
  .t1 { transform: translateY(-20px); }
  .t2 { transform: rotate(-12deg); }
  .t3 { transform: scale(1.3); }
  .lift { width: 130px; background: #fff; border: 1px solid #d1d9e0; box-shadow: 0 10px 22px rgb(31 35 40 / 20%); transform: translateY(-6px); }
</style></head><body>
<div class="wrap">
  <div><p class="label">translateY(-20px)</p><div class="stage"><div class="ghost"></div><div class="box t1">сдвиг</div></div></div>
  <div><p class="label">rotate(-12deg)</p><div class="stage"><div class="ghost"></div><div class="box b2 t2">поворот</div></div></div>
  <div><p class="label">scale(1.3)</p><div class="stage"><div class="ghost"></div><div class="box b3 t3">масштаб</div></div></div>
  <div><p class="label">:hover — приподнять</p><div class="stage"><div class="box lift">карточка</div></div></div>
</div>
</body></html>
