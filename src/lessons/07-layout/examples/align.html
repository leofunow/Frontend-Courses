<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>align-items</title><link rel="stylesheet" href="demo.css"><style>body{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}</style></head><body><div><p class="label">align-items: stretch</p><div class="row" style="align-items:stretch;height:130px;gap:8px"><div class="box" style="padding:6px 10px">1</div><div class="box b2" style="padding:18px 10px">2</div><div class="box b3" style="padding:30px 10px">3</div></div></div><div><p class="label">align-items: flex-start</p><div class="row" style="align-items:flex-start;height:130px;gap:8px"><div class="box" style="padding:6px 10px">1</div><div class="box b2" style="padding:18px 10px">2</div><div class="box b3" style="padding:30px 10px">3</div></div></div><div><p class="label">align-items: center</p><div class="row" style="align-items:center;height:130px;gap:8px"><div class="box" style="padding:6px 10px">1</div><div class="box b2" style="padding:18px 10px">2</div><div class="box b3" style="padding:30px 10px">3</div></div></div><div><p class="label">align-items: flex-end</p><div class="row" style="align-items:flex-end;height:130px;gap:8px"><div class="box" style="padding:6px 10px">1</div><div class="box b2" style="padding:18px 10px">2</div><div class="box b3" style="padding:30px 10px">3</div></div></div></body></html>
