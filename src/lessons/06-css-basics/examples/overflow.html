<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>overflow</title><link rel="stylesheet" href="demo.css">
<style>
  .wrap { grid-template-columns: repeat(3, 220px); gap: 32px; padding-bottom: 40px; }
  .t { height: 64px; padding: 10px; border: 2px dashed #afb8c1; border-radius: 8px; background: #f6f8fa; }
  .t p { margin: 0; }
  .vis { overflow: visible; }
  .hid { overflow: hidden; }
  .auto { overflow: auto; scrollbar-width: thin; scrollbar-color: #818b98 #eaeef2; }
</style></head><body>
<div class="wrap">
  <div class="cell"><p class="label">visible — по умолчанию</p><div class="t vis"><p>Капучино, латте, раф, флэт уайт, какао, матча, чай с облепихой и имбирём</p></div></div>
  <div class="cell"><p class="label">hidden — обрезать</p><div class="t hid"><p>Капучино, латте, раф, флэт уайт, какао, матча, чай с облепихой и имбирём</p></div></div>
  <div class="cell"><p class="label">auto — прокрутка ↕</p><div class="t auto" id="auto"><p>Капучино, латте, раф, флэт уайт, какао, матча, чай с облепихой и имбирём</p></div></div>
</div>
<script>document.getElementById("auto").scrollTop = 22;</script>
</body></html>
