<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Шрифты</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Montserrat:wght@700&family=Rubik:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo.css">
<style>
  .wrap { grid-template-columns: repeat(2, 360px); gap: 18px 32px; }
  .s { margin: 0; font-size: 28px; line-height: 1.2; }
</style></head><body>
<div class="wrap">
  <div class="cell"><p class="label">системный: -apple-system, sans-serif</p><p class="s" style="font-weight:600">Кофейня «Зерно»</p></div>
  <div class="cell"><p class="label">Montserrat — строгий, для заголовков</p><p class="s" style="font-family:Montserrat, sans-serif;font-weight:700">Кофейня «Зерно»</p></div>
  <div class="cell"><p class="label">Lora — с засечками, уютный</p><p class="s" style="font-family:Lora, serif;font-weight:600">Кофейня «Зерно»</p></div>
  <div class="cell"><p class="label">Rubik — мягкий, дружелюбный</p><p class="s" style="font-family:Rubik, sans-serif;font-weight:500">Кофейня «Зерно»</p></div>
</div>
</body></html>
