<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Оформление текста</title><link rel="stylesheet" href="demo.css">
<style>
  .wrap { grid-template-columns: repeat(2, 320px); gap: 16px 32px; }
  .s { margin: 0; font-size: 22px; }
</style></head><body>
<div class="wrap">
  <div class="cell"><p class="label">text-transform: uppercase; letter-spacing: 0.1em</p><p class="s" style="text-transform:uppercase;letter-spacing:.1em;font-size:18px;font-weight:600">Сезонное меню</p></div>
  <div class="cell"><p class="label">text-decoration: line-through</p><p class="s"><span style="text-decoration:line-through;color:#818b98">290 ₽</span> 220 ₽</p></div>
  <div class="cell"><p class="label">font-weight: 300 / 700</p><p class="s"><span style="font-weight:300">Лёгкий</span> и <span style="font-weight:700">жирный</span></p></div>
  <div class="cell"><p class="label">text-decoration-color, underline-offset</p><p class="s"><span style="text-decoration:underline;text-decoration-color:#bc4c00;text-decoration-thickness:3px;text-underline-offset:5px">Ссылка с отступом</span></p></div>
  <div class="cell"><p class="label">font-style: italic</p><p class="s" style="font-style:italic">Обжариваем каждую неделю</p></div>
  <div class="cell"><p class="label">text-shadow</p><p class="s" style="font-weight:800;font-size:26px;color:#fff;background:#bc4c00;padding:6px 10px;border-radius:8px;text-shadow:0 2px 0 #762c00">Зерно</p></div>
</div>
</body></html>
