<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>aspect-ratio</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; font: 15px/1.4 -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #fff; }
  .wrap { display: grid; grid-template-columns: repeat(3, 220px); gap: 20px; align-items: start; }
  .label { margin: 0 0 6px; font: 600 13px/1.4 ui-monospace, Menlo, monospace; color: #59636e; }
  .box { width: 100%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #0550ae; background: #ddf4ff; border: 1.5px solid #0969da; border-radius: 8px; }
</style></head>
<body>
  <div class="wrap">
    <div><p class="label">aspect-ratio: 16 / 9</p><div class="box" style="aspect-ratio: 16 / 9">видео</div></div>
    <div><p class="label">aspect-ratio: 4 / 3</p><div class="box" style="aspect-ratio: 4 / 3">фото товара</div></div>
    <div><p class="label">aspect-ratio: 1</p><div class="box" style="aspect-ratio: 1">аватар</div></div>
  </div>
</body></html>
