<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>details и summary</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; font: 17px/1.5 -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #fff; }
  .faq { width: 560px; }
  h2 { margin: 0 0 10px; font-size: 22px; }
  details { padding: 10px 14px; margin-bottom: 8px; border: 1px solid #d1d9e0; border-radius: 8px; }
  summary { font-weight: 600; cursor: pointer; }
  details p { margin: 8px 0 0; color: #59636e; }
</style></head>
<body>
<div class="faq">
  <h2>Частые вопросы</h2>
  <details><summary>Можно ли с собакой?</summary><p>Да, на веранде. Воду для собаки нальём сами.</p></details>
  <details open><summary>Есть ли растительное молоко?</summary><p>Овсяное, миндальное и кокосовое — без доплаты.</p></details>
  <details><summary>Как забронировать столик?</summary><p>Через форму на сайте или по телефону.</p></details>
</div>
</body></html>
